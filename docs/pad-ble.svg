<text class="note" x="760" y="480" text-anchor="start">NOT GPIO4, GPIO5 or GPIO15: strapping pins on the C6. The three</text>
<text class="note" x="760" y="493" text-anchor="start">pad pins above are the map firmware/bridge/bridge.ino already</text>
<text class="note" x="760" y="506" text-anchor="start">polls a pad on, so firmware/pad-ble reuses poll_pad unedited.</text>
<text class="note" x="760" y="519" text-anchor="start"></text>
<text class="note" x="760" y="532" text-anchor="start">GPIO10 (MODE_SW) and GPIO11 (LED) are NC here: the firmware reads</text>
<text class="note" x="760" y="545" text-anchor="start">one with a pullup and drives the other, and neither is wired.</text>
<text class="note" x="760" y="558" text-anchor="start">Declared rather than omitted, so the netlist sees a statement</text>
<text class="note" x="760" y="571" text-anchor="start">instead of silence.</text>
<text class="note" x="760" y="584" text-anchor="start"></text>
<text class="note" x="760" y="597" text-anchor="start">C1 sits across the devkit's own 3V3 and GND pins. The devkit is</text>
<text class="note" x="760" y="610" text-anchor="start">regulated already; this is for the breadboard's inductance, which</text>
<text class="note" x="760" y="623" text-anchor="start">is what the bridge's own 100 nF was added for on 2026-09-15.</text>
<rect class="zone" x="20" y="790" width="1520" height="210" rx="6"/>
<text class="sub" x="28" y="804" text-anchor="start">WHAT THIS BOARD CAN AND CANNOT DO, and why the answer is in silicon</text>
<text class="pin" x="40" y="824" text-anchor="start">BLE HID</text>
<text class="pin" x="168" y="824" text-anchor="start">Works, and reaches a phone with no app: a BLE HID-over-GATT keyboard pairs in Settings beside a Magic Keyboard. Browser emulators take keys.</text>
<text class="pin" x="168" y="838" text-anchor="start">Needs four things, each in firmware/pad-ble/pad-ble.ino with its reason: bonding with encryption, the PnP ID, a battery service, and the HID</text>
<text class="pin" x="168" y="852" text-anchor="start">service UUID plus the keyboard appearance IN THE ADVERTISEMENT, since a host decides what to offer as a pairable accessory from the advert alone.</text>
<text class="pin" x="40" y="870" text-anchor="start">USB HID</text>
<text class="pin" x="168" y="870" text-anchor="start">IMPOSSIBLE ON THIS PART, and not for want of firmware. The port marked USB is a USB-Serial-JTAG bridge, fixed in silicon. Its soc_caps.h defines</text>
<text class="pin" x="168" y="884" text-anchor="start">SOC_USB_SERIAL_JTAG_SUPPORTED and does NOT define SOC_USB_OTG_SUPPORTED, and the core gates USBHIDKeyboard.h on the latter, so it compiles away.</text>
<text class="pin" x="168" y="898" text-anchor="start">Read off the installed esp32 core 3.3.11 on 2026-09-21, not recalled. USB HID needs an S3, S2 or P4, and an S3 does BLE too, so it gets both modes.</text>
<text class="pin" x="40" y="916" text-anchor="start">Gamepad HID</text>
<text class="pin" x="168" y="916" text-anchor="start">Not built. iOS refuses a generic HID gamepad, taking only the MFi, Xbox, PlayStation and Switch Pro layouts, which is why keyboard mode came first.</text>
<text class="pin" x="40" y="934" text-anchor="start">Two players</text>
<text class="pin" x="168" y="934" text-anchor="start">One pad sends keys. A keyboard report carries six key slots and two pads can ask for ten, so two on one report would drop whichever arrived last.</text>
<text class="pin" x="168" y="948" text-anchor="start">Pad 2 is polled and printed so its wiring can be proved. Two players wants gamepad mode with two report IDs, on a part that can do it.</text>
<text class="pin" x="40" y="966" text-anchor="start">Bench mode</text>
<text class="pin" x="168" y="966" text-anchor="start">Not built, and the cheapest of them: the C6's USB already IS a serial port, so pad bytes over USB serial into a uinput shim need no new hardware.</text>
</svg>