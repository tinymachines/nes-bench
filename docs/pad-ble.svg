<text class="note" x="330" y="110" text-anchor="start">The pad's 4021 is a CMOS part rated 3 to 18 V, so at 3V3 its</text>
<text class="note" x="330" y="123" text-anchor="start">D0 is 3V3 logic and needs no shifter. That is the datasheet,</text>
<text class="note" x="330" y="136" text-anchor="start">not this bench: MEASURE FIRST, item 4. If a pad will not</text>
<text class="note" x="330" y="149" text-anchor="start">follow its buttons at 3V3, add a 74LVC245 and feed the pad</text>
<text class="note" x="330" y="162" text-anchor="start">5 V; the 245 is on hand.</text>
<text class="note" x="330" y="175" text-anchor="start"></text>
<text class="note" x="330" y="188" text-anchor="start">Both pads share PAD_LATCH and PAD_CLK. They are separate shift</text>
<text class="note" x="330" y="201" text-anchor="start">registers on one strobe, so one pass clocks both and the</text>
<text class="note" x="330" y="214" text-anchor="start">second pad costs a pin, not a poll.</text>
<text class="note" x="330" y="227" text-anchor="start"></text>
<text class="note" x="330" y="240" text-anchor="start">Pin 5 is the supply and 6 and 7 carry nothing, as measured on</text>
<text class="note" x="330" y="253" text-anchor="start">this console's own cable (docs/wiring.md). RING THE CABLE OUT</text>
<text class="note" x="330" y="266" text-anchor="start">UNPLUGGED: a tone through a cable still in the console runs</text>
<text class="note" x="330" y="279" text-anchor="start">through its pull-ups, and pins that share nothing beep.</text>
<path class="wire" d="M330,690 l-6,-6 h-53.4 v12 h53.4 z"/>
