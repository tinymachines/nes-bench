<g class="sheet-heading" data-height="60">
<text class="title" x="24" y="30">pad-ble v1: two original pads into an ESP32-C6, as a BLE keyboard</text>
<text class="sub" x="24" y="46">The buildable subset of pad-adapter.svg: USB powered, no cell, no charger, no mode switch. The board on the bench is an ESP32-C6-DevKitC-1 v1.2, read off its RGB@IO8 silkscreen 2026-09-21. Nothing built.</text>
</g>
