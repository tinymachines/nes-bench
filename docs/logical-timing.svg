<path class="lane" d="M200,262 L400,262 L400,298 L412,298 L412,262 L475,262 L475,298 L487,298 L487,262 L550,262 L550,298 L562,298 L562,262 L625,262 L625,298 L637,298 L637,262 L700,262 L700,298 L712,298 L712,262 L775,262 L775,298 L787,298 L787,262 L850,262 L850,298 L862,298 L862,262 L925,262 L925,298 L937,298 L937,262 L1440,262"/>
<text class="auth" x="400" y="312" text-anchor="start">LDA $4016: /OE1 low ~500 ns (authored); 4021 and 165 shift on the rising edge</text>
<text class="auth" x="495" y="256" text-anchor="start">~7 us between reads (authored)</text>
<path class="lane" d="M200,332 L300,332 L300,368 L412,368 L412,368 L412,332 L487,332 L487,332 L487,332 L562,332 L562,332 L562,332 L637,332 L637,332 L637,332 L712,332 L712,332 L712,332 L787,332 L787,332 L787,332 L862,332 L862,332 L862,332 L937,332 L937,332 L937,368 L1440,368"/>
<text class="pin" x="304" y="382" text-anchor="start">A pressed: LOW</text>
<text class="pin" x="941" y="382" text-anchor="start">9th+ read: LOW (console reads 1)</text>
<line class="mark" x1="260" y1="416" x2="260" y2="448"/>
<text class="net" x="265" y="434" text-anchor="start">+1 on OUT0 rising edge: latch index n</text>
