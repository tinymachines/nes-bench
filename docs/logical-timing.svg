<line x1="1400" y1="548" x2="1400" y2="572" stroke="#57606a" stroke-width="1"/>
<text class="note" x="234" y="544" text-anchor="start">loop ~100 us: read PCNT deltas, emit L, then write the byte</text>
<rect class="safe" x="200" y="618" width="52" height="28"/>
<rect class="safe" x="308" y="618" width="1132" height="28"/>
<text class="pin" x="206" y="634" text-anchor="start">write allowed</text>
<text class="pin" x="314" y="634" text-anchor="start">write allowed (v1: OUT0 reads low before and after; v2: RCLK edge is atomic anyway)</text>
<rect class="zone" x="20" y="690" width="1460" height="190" rx="6"/>
<text class="sub" x="28" y="704" text-anchor="start">WHAT A RUN IS: the same history on both sides</text>
<text class="pin" x="40" y="725" text-anchor="start">latch index n     count of OUT0 rising edges since RESET. Part: PCNT 0. Model: $4016 strobe rises in nes-glue::controller.</text>
<text class="pin" x="40" y="738" text-anchor="start">byte at n         what the register held when OUT0 fell at n. Part: written after latch n-1 (v1) or moved by RCLK after n-1 (v2). Model: set_pad before latch n.</text>
<text class="pin" x="40" y="751" text-anchor="start">clocks at n       CLK falling edges between latch n and n+1. Part: PCNT 1 delta. Model: $4016 reads. 8 expected; 9 on a DMC collision.</text>
<text class="pin" x="40" y="764" text-anchor="start">t_us at n (v2)    micros() at detection, jitter one loop. Gives latch interval and, against F lines, polls per field without the scope.</text>
<text class="pin" x="40" y="777" text-anchor="start">field f, line l   (v2) VSYNC falling edges since RESET; CSYNC falling edges since the last VSYNC. Model: h at the strobe, mapped by B2's alignment class.</text>
<text class="pin" x="40" y="790" text-anchor="start">trigger           EXT TRIG rises at latch T (v1) or at (f, l) (v2); the scope's single shot lands on a known frame of a known history.</text>
<text class="pin" x="40" y="803" text-anchor="start"></text>
<text class="pin" x="40" y="816" text-anchor="start">Script (docs/script.md) -> head (Pi) -> bridge over USB serial -> 165 -> console.    Console -> L lines -> head -> runs/&lt;stamp>/bridge.log.</text>
<text class="pin" x="40" y="829" text-anchor="start">Same script -> nes-console pad-log -> the same L lines.    compare-logs.py: first latch where byte or clocks differ.    b1-score: capture at T vs model frame at T.</text>
<text class="pin" x="40" y="842" text-anchor="start">MUTATE (v2 command): PCNT 0 and 1 swapped -> 8-per-latch check must go red.  A gate that stays green under MUTATE is a broken gate.</text>
</svg>