<text class="note" x="48.0" y="379.0" text-anchor="start">TP1 is where the red lead to CH1 lands on the breadboard (R1's far end), and TP2 and TP3</text>
<text class="note" x="48.0" y="392.0" text-anchor="start">where CH2 and CH4 sit (U1 pin 1 and U2 pin 9, cheat-sheet.md). TP4 is new: the clock as</text>
<text class="note" x="48.0" y="405.0" text-anchor="start">the 165 sees it, after the filter. A Keystone 5000 takes a probe's hook; the two blacks</text>
<text class="note" x="48.0" y="418.0" text-anchor="start">are the probes' grounds, on the console's ground like the breadboard's GND rail.</text>
