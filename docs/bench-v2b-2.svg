<text class="note" x="190.0" y="501.0" text-anchor="start">one across each of U1, U2, U5,</text>
<text class="note" x="190.0" y="514.0" text-anchor="start">U6, U7 and U8, at its own</text>
<text class="note" x="190.0" y="527.0" text-anchor="start">supply pins</text>
<text class="note" x="382.0" y="501.0" text-anchor="start">Two SPI.transfer() calls, port 2's byte first and then port 1's, and one RCLK</text>
<text class="note" x="382.0" y="514.0" text-anchor="start">edge updates both registers together. A tear during a load is impossible, and the</text>
<text class="note" x="382.0" y="527.0" text-anchor="start">firmware still only pulses RCLK while both OUT0 lines read low.</text>
<text class="note" x="382.0" y="540.0" text-anchor="start">The UNO's outputs are 5 V, so HC parts at 5 V see real highs everywhere. There is</text>
<text class="note" x="382.0" y="553.0" text-anchor="start">not one level shifter on any sheet of this drawing.</text>
</svg>