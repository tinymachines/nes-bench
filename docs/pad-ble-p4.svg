<line class="lead" x1="820" y1="300" x2="838" y2="300"/><rect class="box" x="838" y="293" width="44" height="14"/><line class="lead" x1="882" y1="300" x2="900" y2="300"/>
<text class="pinno" x="860" y="290" text-anchor="middle">C1</text>
<text class="pin" x="860" y="304" text-anchor="middle">100nF</text>
<line class="wg" x1="900" y1="300" x2="900" y2="308"/><line class="wg" x1="894" y1="308" x2="906" y2="308"/><line class="wg" x1="897" y1="311" x2="903" y2="311"/>
<text class="note" x="760" y="350" text-anchor="start">PIN 1 IS NOT WHERE A RASPBERRY PI PUTS IT. The header is</text>
<text class="note" x="760" y="363" text-anchor="start">Pi-shaped and numbered the other way round: 5V on 1 and 3 where</text>
<text class="note" x="760" y="376" text-anchor="start">a Pi has 2 and 4, 3V3 on 2 and 18 where a Pi has 1 and 17, and</text>
<text class="note" x="760" y="389" text-anchor="start">every ground one pin from where a Pi user reaches. A HAT fits</text>
<text class="note" x="760" y="402" text-anchor="start">this board and does not work. Count from the schematic.</text>
<text class="note" x="760" y="415" text-anchor="start"></text>
<text class="note" x="760" y="428" text-anchor="start">THE WHOLE CIRCUIT IS FIVE HOLES IN A ROW. Find the SECOND 3V3</text>
<text class="note" x="760" y="441" text-anchor="start">on the even row; it reads</text>
<text class="note" x="760" y="454" text-anchor="start"></text>
<text class="note" x="760" y="467" text-anchor="start">        6    3V3    3    2    0    GND</text>
<text class="note" x="760" y="480" text-anchor="start">       p16   p18   p20  p22  p24  p26</text>
<text class="note" x="760" y="493" text-anchor="start"></text>
<text class="note" x="760" y="506" text-anchor="start">and the build takes all of them EXCEPT 0. One landmark and one</text>
<text class="note" x="760" y="519" text-anchor="start">hole to skip beats five numbers: wired by number on 2026-09-25,</text>
<text class="note" x="760" y="532" text-anchor="start">two of the three signal wires went in wrong.</text>
<text class="note" x="760" y="545" text-anchor="start"></text>
<text class="note" x="760" y="558" text-anchor="start">TEN PINS REACH P6 AND ARE STILL NOT YOURS. Worst is GPIO54</text>
<text class="note" x="760" y="571" text-anchor="start">(pin 31), the onboard C6's RESET: take it and the radio dies.</text>
<text class="note" x="760" y="584" text-anchor="start">Sheets 8 to 10 list all ten with what each is wired to.</text>
<text class="note" x="760" y="597" text-anchor="start"></text>
<text class="note" x="760" y="610" text-anchor="start">MODE_SW AND LED MOVED, and had to. On the C6 they were GPIO10</text>
<text class="note" x="760" y="623" text-anchor="start">and GPIO11 and cost nothing because nothing was wired to them.</text>
<text class="note" x="760" y="636" text-anchor="start">Here those numbers are the ES8311 codec's I2S and are not on</text>
<text class="note" x="760" y="649" text-anchor="start">the header at all. They are GPIO21 and GPIO20 now, P6 pins 12</text>
<text class="note" x="760" y="662" text-anchor="start">and 14, free and on the same even row. Declared, not wired.</text>
<text class="note" x="760" y="675" text-anchor="start"></text>
<text class="note" x="760" y="688" text-anchor="start">C1 goes across the breadboard's own 3V3 and GND rails, not the</text>
<text class="note" x="760" y="701" text-anchor="start">board's pins: the module is regulated already and this is for</text>
<text class="note" x="760" y="714" text-anchor="start">the breadboard's inductance, as on the bridge since 2026-09-15.</text>
<rect class="zone" x="20" y="782" width="1520" height="262" rx="6"/>
<text class="sub" x="28" y="796" text-anchor="start">WHAT THIS BOARD DOES, MEASURED, and why the direction changed on 2026-09-25</text>
<text class="pin" x="40" y="812" text-anchor="start">USB HID</text>
<text class="pin" x="168" y="812" text-anchor="start">THIS IS THE BUILD. Boots clean, 18% of flash, and prints B FF with no pad wired, which is right: D0 floats with no pullup so all</text>
<text class="pin" x="168" y="825" text-anchor="start">eight bits read pressed. soc_caps.h gives the P4 SOC_USB_OTG_SUPPORTED with two OTG peripherals, which the C6 never had. No radio,</text>
<text class="pin" x="168" y="838" text-anchor="start">no co-processor, no SDIO, no pairing: a USB-C cable to a phone and nothing in the path that can fail. Plug the HOST into the socket</text>
<text class="pin" x="168" y="851" text-anchor="start">marked USB, not PWR USB TO UART, and set the jumper to DEVICE. The UART socket stays on the bench head for the serial log.</text>
<text class="pin" x="40" y="867" text-anchor="start">BLE HID</text>
<text class="pin" x="168" y="867" text-anchor="start">REACHES THE AIR BUT CRASHES THIS FIRMWARE, and not in our code. The P4 has no radio; the module's ESP32-C6 is it, over SDIO. The host's</text>
<text class="pin" x="168" y="880" text-anchor="start">esp-hosted 2.12.11 asks that C6 for its firmware version, gets no answer, and the failure path reads a pointer nobody filled in:</text>
<text class="pin" x="168" y="893" text-anchor="start">always 2881 ms after BLEDevice::init. Five explanations tested and eliminated (build options and PSRAM, the security block, a delay</text>
<text class="pin" x="168" y="906" text-anchor="start">before init, a delay after init, our own GPIO setup). A smaller sketch survives the IDENTICAL timeout, so the garbage it reads is</text>
<text class="pin" x="168" y="919" text-anchor="start">harmless there: luck, not correctness. The proper fix is the C6's slave firmware, through the C6 UART header. Not done.</text>
<text class="pin" x="40" y="935" text-anchor="start">Proven</text>
<text class="pin" x="168" y="935" text-anchor="start">The radio itself works: on 2026-09-24 the bench Pi's own receiver heard this board advertise at B0:A6:04:8A:D7:0E, which is NOT the</text>
<text class="pin" x="168" y="948" text-anchor="start">P4's MAC, because the advertisement came off the C6. The BLE fault is the version RPC and its aftermath, not the link.</text>
<text class="pin" x="40" y="964" text-anchor="start">Flashing</text>
<text class="pin" x="168" y="964" text-anchor="start">First try, where the C6 devkit never once answered. On /dev/p4-uart through the board's CH343 at 1a86:55d3. The factory image was read</text>
<text class="pin" x="168" y="977" text-anchor="start">off and kept before anything was written: 16 MB, sha256 ad22bf07..., so this board goes back if it has to.</text>
<text class="pin" x="40" y="993" text-anchor="start">Two players</text>
<text class="pin" x="168" y="993" text-anchor="start">Not on this sheet. A keyboard report carries six key slots and two pads can ask for ten, so a second pad could be polled and never sent.</text>
</svg>