<line class="lead" x1="1110" y1="156" x2="1136" y2="156"/>
<text class="pin" x="1105" y="159.5" text-anchor="end">BLE</text>
<path class="offsheet" d="M1136 148 L1167.0 148 L1175.0 156 L1167.0 164 L1136 164 Z"/>
<text class="net" x="1141" y="159.5" text-anchor="start">radio</text>
<line class="lead" x1="1110" y1="182" x2="1136" y2="182"/>
<text class="pin" x="1105" y="185.5" text-anchor="end">USB-C</text>
