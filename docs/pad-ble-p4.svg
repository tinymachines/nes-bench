<text class="net" x="865" y="159.5" text-anchor="end">PAD_LATCH</text>
<line class="lead" x1="874" y1="182" x2="900" y2="182"/>
<text class="pin" x="905" y="185.5" text-anchor="start">GPIO3</text>
<text class="pinno" x="896" y="180" text-anchor="end">20</text>
<path class="wire" d="M874,182 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="865" y="185.5" text-anchor="end">PAD_CLK</text>
<line class="lead" x1="874" y1="208" x2="900" y2="208"/>
<text class="pin" x="905" y="211.5" text-anchor="start">GPIO6</text>
<text class="pinno" x="896" y="206" text-anchor="end">16</text>
