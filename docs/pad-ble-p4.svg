<text class="net" x="1141" y="185.5" text-anchor="start">VBUS</text>
<line class="w3" x1="820" y1="330" x2="820" y2="321"/><line class="w3" x1="815" y1="321" x2="825" y2="321"/>
<text class="rail3" x="820" y="319" text-anchor="middle">3V3</text>
<line class="lead" x1="820" y1="330" x2="838" y2="330"/><rect class="box" x="838" y="323" width="44" height="14"/><line class="lead" x1="882" y1="330" x2="900" y2="330"/>
<text class="pinno" x="860" y="320" text-anchor="middle">C1</text>
<text class="pin" x="860" y="334" text-anchor="middle">100nF</text>
<line class="wg" x1="900" y1="330" x2="900" y2="338"/><line class="wg" x1="894" y1="338" x2="906" y2="338"/><line class="wg" x1="897" y1="341" x2="903" y2="341"/>
<text class="note" x="760" y="390" text-anchor="start">PIN 1 IS NOT WHERE A RASPBERRY PI PUTS IT. The header is</text>
<text class="note" x="760" y="403" text-anchor="start">Pi-shaped and numbered the other way round: 5V on 1 and 3 where</text>
<text class="note" x="760" y="416" text-anchor="start">a Pi has 2 and 4, 3V3 on 2 and 18 where a Pi has 1 and 17, and</text>
<text class="note" x="760" y="429" text-anchor="start">every ground one pin from where a Pi user reaches. A HAT fits</text>
<text class="note" x="760" y="442" text-anchor="start">this board and does not work. Count from the schematic.</text>
<text class="note" x="760" y="455" text-anchor="start"></text>
<text class="note" x="760" y="468" text-anchor="start">THE WHOLE CIRCUIT IS FIVE HOLES IN A ROW. Find the SECOND 3V3</text>
<text class="note" x="760" y="481" text-anchor="start">on the even row; the even row there reads</text>
<text class="note" x="760" y="494" text-anchor="start"></text>
<text class="note" x="760" y="507" text-anchor="start">        6    3V3    3    2    0    GND</text>
<text class="note" x="760" y="520" text-anchor="start">       p16   p18   p20  p22  p24  p26</text>
<text class="note" x="760" y="533" text-anchor="start"></text>
<text class="note" x="760" y="546" text-anchor="start">and the build takes every one of them EXCEPT 0. Data, supply,</text>
<text class="note" x="760" y="559" text-anchor="start">clock, latch, skip, ground. One landmark to find and one hole</text>
<text class="note" x="760" y="572" text-anchor="start">to skip, which is a better instruction than five numbers:</text>
<text class="note" x="760" y="585" text-anchor="start">wiring this by number on 2026-09-25, two of the three signal</text>
<text class="note" x="760" y="598" text-anchor="start">wires went in wrong. All five being even was chosen so nothing</text>
<text class="note" x="760" y="611" text-anchor="start">crosses the header; that they are also consecutive was not</text>
<text class="note" x="760" y="624" text-anchor="start">noticed until somebody built it.</text>
<text class="note" x="760" y="637" text-anchor="start"></text>
<text class="note" x="760" y="650" text-anchor="start">FOUR PINS REACH P6 AND ARE STILL NOT YOURS. GPIO54 (pin 31) is</text>
<text class="note" x="760" y="663" text-anchor="start">the onboard C6's RESET, and taking it kills the radio that makes</text>
<text class="note" x="760" y="676" text-anchor="start">this part worth using. GPIO45 (39) switches the MicroSD's power,</text>
<text class="note" x="760" y="689" text-anchor="start">GPIO53 (36) is the speaker amplifier's CTRL, GPIO36 (23) is a</text>
<text class="note" x="760" y="702" text-anchor="start">strapping pin. GPIO24 and 25 (28, 27) are the USB pair, and</text>
<text class="note" x="760" y="715" text-anchor="start">GPIO7 and 8 (4, 6) are the codec's I2C with pullups on board.</text>
<text class="note" x="760" y="728" text-anchor="start"></text>
<text class="note" x="760" y="741" text-anchor="start">MODE_SW AND LED MOVED, and had to. On the C6 they were GPIO10</text>
<text class="note" x="760" y="754" text-anchor="start">and GPIO11 and cost nothing because nothing was wired to them.</text>
<text class="note" x="760" y="767" text-anchor="start">Here those numbers are the ES8311 codec's I2S and are not on the</text>
<text class="note" x="760" y="780" text-anchor="start">header at all. They are GPIO21 and GPIO20 now, P6 pins 12 and</text>
<text class="note" x="760" y="793" text-anchor="start">14, free and on the same even row. Declared, still not wired.</text>
<text class="note" x="760" y="806" text-anchor="start"></text>
<text class="note" x="760" y="819" text-anchor="start">C1 goes across the breadboard's own 3V3 and GND rails, not the</text>
<text class="note" x="760" y="832" text-anchor="start">board's pins: the module is regulated already and this is for</text>
<text class="note" x="760" y="845" text-anchor="start">the breadboard's inductance, as on the bridge since 2026-09-15.</text>
<rect class="zone" x="20" y="790" width="1520" height="210" rx="6"/>
<text class="sub" x="28" y="804" text-anchor="start">WHAT THIS BOARD CAN AND CANNOT DO, and the radio is not on the die</text>
<text class="pin" x="40" y="824" text-anchor="start">BLE HID</text>
<text class="pin" x="168" y="824" text-anchor="start">Works, and PROVEN ON THIS BOARD 2026-09-24: the bench Pi's own radio heard it advertise at B0:A6:04:8A:D7:0E, which is not the P4's MAC.</text>
<text class="pin" x="168" y="838" text-anchor="start">THE P4 HAS NO RADIO. soc_caps.h defines neither SOC_BLE_SUPPORTED nor SOC_WIFI_SUPPORTED for it. The module carries an ESP32-C6 as its radio,</text>
<text class="pin" x="168" y="852" text-anchor="start">reached over SDIO on GPIO14 to 19 with reset on GPIO54, and the NimBLE host runs on the P4 with CONFIG_BT_CONTROLLER_DISABLED=y. The core's</text>
<text class="pin" x="168" y="866" text-anchor="start">BLE classes are gated #if defined(SOC_BLE_SUPPORTED) || defined(CONFIG_ESP_HOSTED_ENABLE_BT_NIMBLE), and the P4 sets the second arm.</text>
<text class="pin" x="40" y="884" text-anchor="start">Flashing</text>
<text class="pin" x="168" y="884" text-anchor="start">First try, no boot button, no reset dance, where the C6 never once answered. On /dev/ttyACM1 through the board's CH343 bridge at 1a86:55d3.</text>
<text class="pin" x="168" y="898" text-anchor="start">The factory image was read off and kept before anything was written: 16 MB, sha256 ad22bf07..., so this board goes back if it has to.</text>
<text class="pin" x="40" y="916" text-anchor="start">USB HID</text>
<text class="pin" x="168" y="916" text-anchor="start">POSSIBLE ON THIS PART, unlike the C6, and not built. soc_caps.h gives it SOC_USB_OTG_SUPPORTED with two OTG peripherals and a UTMI PHY, so one</text>
<text class="pin" x="168" y="930" text-anchor="start">is high speed. A HID keyboard is an 8-byte report on an interrupt endpoint and a pad offers 60 a second, so the speed buys nothing: what it</text>
<text class="pin" x="168" y="944" text-anchor="start">buys is a USB-C cable to a phone with no pairing at all. The board has a HOST/DEVICE jumper and a socket marked USB for exactly this.</text>
<text class="pin" x="40" y="962" text-anchor="start">Gamepad HID</text>
<text class="pin" x="168" y="962" text-anchor="start">Not built. iOS refuses a generic HID gamepad, taking only the MFi, Xbox, PlayStation and Switch Pro layouts, which is why keyboard mode came first.</text>
<text class="pin" x="40" y="980" text-anchor="start">Two players</text>
<text class="pin" x="168" y="980" text-anchor="start">Not on this sheet. A keyboard report carries six key slots and two pads can ask for ten, so a second pad could be polled and never sent.</text>
</svg>