<text class="note" x="330" y="110" text-anchor="start">Unchanged from pad-ble.svg, and that is the point: GPIO2, 3 and</text>
<text class="note" x="330" y="123" text-anchor="start">6 exist and are free on BOTH parts, so poll_pad in</text>
<text class="note" x="330" y="136" text-anchor="start">firmware/pad-ble runs unedited on either. One sketch, one pad</text>
<text class="note" x="330" y="149" text-anchor="start">map, two targets.</text>
<text class="note" x="330" y="162" text-anchor="start"></text>
<text class="note" x="330" y="175" text-anchor="start">The pad's 4021 is a CMOS part rated 3 to 18 V, so at 3V3 its D0</text>
<text class="note" x="330" y="188" text-anchor="start">is 3V3 logic and needs no shifter. That is the datasheet, not</text>
<text class="note" x="330" y="201" text-anchor="start">this bench: MEASURE FIRST, item 4, open since 2026-09-07. If a</text>
<text class="note" x="330" y="214" text-anchor="start">pad will not follow its buttons at 3V3, add a 74LVC245 and feed</text>
<text class="note" x="330" y="227" text-anchor="start">the pad 5 V; the 245 is on hand.</text>
<text class="note" x="330" y="240" text-anchor="start"></text>
<text class="note" x="330" y="253" text-anchor="start">Pin 5 is the supply and 6 and 7 carry nothing, as measured on</text>
<text class="note" x="330" y="266" text-anchor="start">this console's own cable (docs/wiring.md). RING THE CABLE OUT</text>
<text class="note" x="330" y="279" text-anchor="start">UNPLUGGED: a tone through a cable still in the console runs</text>
<text class="note" x="330" y="292" text-anchor="start">through its pull-ups, and pins that share nothing beep.</text>
<path class="wire" d="M330,690 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="321" y="693.5" text-anchor="end">PAD1_D0</text>
<line class="lead" x1="330" y1="690" x2="348" y2="690"/><rect class="box" x="348" y="683" width="44" height="14"/><line class="lead" x1="392" y1="690" x2="410" y2="690"/>
<text class="pinno" x="370" y="680" text-anchor="middle">R1</text>
<text class="pin" x="370" y="694" text-anchor="middle">10k</text>
<line class="w3" x1="410" y1="690" x2="410" y2="681"/><line class="w3" x1="405" y1="681" x2="415" y2="681"/>
<text class="rail3" x="410" y="679" text-anchor="middle">3V3</text>
<rect class="zone" x="730" y="66" width="810" height="700" rx="6"/>
<text class="sub" x="738" y="80" text-anchor="start">THE CONTROLLER, on its own USB power, wired at header P6</text>
<rect class="conn" x="900" y="100" width="210" height="180" rx="3"/>
<text class="ref" x="906" y="114" text-anchor="start">U1</text>
<text class="part" x="906" y="126" text-anchor="start">ESP32-P4-Module-DEV-KIT</text>
<text class="part" x="901" y="293" text-anchor="start">header P6; pin numbers are P6's own</text>
<line class="lead" x1="874" y1="156" x2="900" y2="156"/>
<text class="pin" x="905" y="159.5" text-anchor="start">GPIO2</text>
<text class="pinno" x="896" y="154" text-anchor="end">22</text>
