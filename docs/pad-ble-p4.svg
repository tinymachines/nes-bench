<rect x="0" y="0" width="1560" height="1060" fill="#ffffff"/>
<g class="sheet-heading" data-height="60">
<text class="title" x="24" y="30">pad-ble v1 on the ESP32-P4: one pad into header P6, as a USB keyboard</text>
<text class="sub" x="24" y="46">The build is USB now, not BLE. A Waveshare ESP32-P4-Module-DEV-KIT, header read from the vendor schematic 2026-09-24 and every hole confirmed with firmware/header-probe 2026-09-25. The wiring is the same either way.</text>
</g>
<rect class="zone" x="20" y="66" width="690" height="700" rx="6"/>
<text class="sub" x="28" y="80" text-anchor="start">THE PAD, polled at 3V3 exactly as the bridge polls one</text>
