<rect x="0" y="0" width="1560" height="1060" fill="#ffffff"/>
<g class="sheet-heading" data-height="60">
<text class="title" x="24" y="30">pad-ble v1 on the ESP32-P4: one pad into header P6, as a BLE keyboard</text>
<text class="sub" x="24" y="46">The part that flashes. A Waveshare ESP32-P4-Module-DEV-KIT, its header read from the vendor schematic 2026-09-24. The P4 die has no radio; the module carries an ESP32-C6 as one. Nothing wired yet.</text>
</g>
<rect class="zone" x="20" y="66" width="690" height="700" rx="6"/>
<text class="sub" x="28" y="80" text-anchor="start">THE PAD, polled at 3V3 exactly as the bridge polls one</text>
