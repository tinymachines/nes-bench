<text class="pinno" x="459" y="720" text-anchor="end">8</text>
<text class="pin" x="486" y="720">GND</text>
<rect class="chip" x="300" y="538" width="90" height="44" rx="6"/>
<text class="title" x="345.0" y="558" text-anchor="middle">74HCT04</text>
<text class="sub" x="345" y="574" text-anchor="middle">one gate, +5 V</text>
