<text class="sub" x="565" y="536" text-anchor="middle">at the console's +5 V</text>
<line class="wire" x1="462" y1="560" x2="480" y2="560"/>
<text class="pinno" x="459" y="564" text-anchor="end">1</text>
<text class="pin" x="486" y="564">/PL</text>
