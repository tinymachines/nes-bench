<line class="wire" x1="650" y1="716" x2="668" y2="716"/>
<text class="pinno" x="671" y="720">12</text>
<text class="pin" x="644" y="720" text-anchor="end">B: Left</text>
<line class="wire" x1="650" y1="742" x2="668" y2="742"/>
<text class="pinno" x="671" y="746">11</text>
<text class="pin" x="644" y="746" text-anchor="end">A: Right</text>
<rect class="chip" x="300" y="760" width="150" height="100" rx="6"/>
<text class="title" x="375.0" y="780" text-anchor="middle">74LVC245</text>
<text class="sub" x="375" y="796" text-anchor="middle">3.3 V, 5 V-tolerant inputs</text>
