        .band { font-size: 13px; font-weight: 600; fill: #9aa4b2; letter-spacing: 0.04em; }
        .net { font-size: 10px; fill: #79c0ff; }
        .pin { font-size: 10px; fill: #e6edf3; }
        .pinno { font-size: 9px; fill: #9aa4b2; }
        .box { fill: #0d1117; stroke: #9aa4b2; stroke-width: 1.2; }
        .chip { fill: #161b22; stroke: #e6edf3; stroke-width: 1.4; }
        .wire { fill: none; stroke: #79c0ff; stroke-width: 1.2; }
