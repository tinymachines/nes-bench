<text class="sub" x="24" y="960" text-anchor="start">Three supplies, one ground: the console's +5 V for the 165 and the 04, the C6's 3.3 V for the 245 and the pad. Pin numbers and GPIOs</text>
<text class="sub" x="24" y="975" text-anchor="start">are read from docs/wiring.md by tools/draw-bench.py; the tables there are the source and this drawing is derived. Nothing here is built yet.</text>
