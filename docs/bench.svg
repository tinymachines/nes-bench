<rect class="bg" x="0" y="0" width="1200" height="1000"/>
<text class="band" x="24" y="30" text-anchor="start">THE LOOP: the part and the model under one input history</text>
<rect class="box" x="24" y="50" width="190" height="92" rx="6"/>
<text class="title" x="119.0" y="70" text-anchor="middle">Workstation</text>
<text class="sub" x="119.0" y="88" text-anchor="middle">the switch-level model</text>
<text class="sub" x="119.0" y="103" text-anchor="middle">scripts, pad-log, compare</text>
<text class="sub" x="119.0" y="118" text-anchor="middle">ntsc-crt recovery</text>
<rect class="box" x="300" y="50" width="170" height="92" rx="6"/>
<text class="title" x="385.0" y="70" text-anchor="middle">Raspberry Pi 4</text>
<text class="sub" x="385.0" y="88" text-anchor="middle">the head: UDP in</text>
<text class="sub" x="385.0" y="103" text-anchor="middle">serial to the bridge</text>
<text class="sub" x="385.0" y="118" text-anchor="middle">SCPI to the scope, relays</text>
<rect class="box" x="560" y="50" width="190" height="92" rx="6"/>
<text class="title" x="655.0" y="70" text-anchor="middle">ESP32-C6 bridge</text>
<text class="sub" x="655.0" y="88" text-anchor="middle">counts latch and clock</text>
<text class="sub" x="655.0" y="103" text-anchor="middle">writes the register</text>
<text class="sub" x="655.0" y="118" text-anchor="middle">polls the pad</text>
<rect class="box" x="840" y="50" width="170" height="92" rx="6"/>
<text class="title" x="925.0" y="70" text-anchor="middle">NES-CPU-10</text>
<text class="sub" x="925.0" y="88" text-anchor="middle">controller port header</text>
<text class="sub" x="925.0" y="103" text-anchor="middle">reset button pads</text>
<text class="sub" x="925.0" y="118" text-anchor="middle">video, audio out</text>
<rect class="box" x="300" y="200" width="170" height="60" rx="6"/>
<text class="title" x="385.0" y="220" text-anchor="middle">PC817 module</text>
<text class="sub" x="385.0" y="238" text-anchor="middle">open-collector across reset</text>
<rect class="box" x="840" y="200" width="170" height="60" rx="6"/>
<text class="title" x="925.0" y="220" text-anchor="middle">Original pad</text>
<text class="sub" x="925.0" y="238" text-anchor="middle">in the console's own housing</text>
<rect class="box" x="300" y="290" width="170" height="60" rx="6"/>
<text class="title" x="385.0" y="310" text-anchor="middle">Relay module</text>
<text class="sub" x="385.0" y="328" text-anchor="middle">one lead of the adapter</text>
<rect class="box" x="560" y="290" width="190" height="60" rx="6"/>
<text class="title" x="655.0" y="310" text-anchor="middle">DS1054Z scope</text>
<text class="sub" x="655.0" y="328" text-anchor="middle">video on a channel, EXT TRIG</text>
<path class="wire" d="M 214 96 L 300 96"/>
<text class="net" x="257.0" y="91.0" text-anchor="middle">UDP over the LAN</text>
<path class="wire" d="M 470 96 L 560 96"/>
<text class="net" x="515.0" y="91.0" text-anchor="middle">USB serial, 921600</text>
<path class="wire" d="M 750 84 L 840 84"/>
<text class="net" x="795.0" y="79.0" text-anchor="middle">latch, clock, data</text>
<path class="rail" d="M 840 108 L 750 108"/>
<text class="net" x="795.0" y="120.0" text-anchor="middle">+5 V</text>
<path class="wire" d="M 840 230 L 700 230 L 700 142"/>
<text class="net" x="770.0" y="242.0" text-anchor="middle">polled at 3.3 V</text>
<path class="wire" d="M 655 142 L 655 290"/>
<text class="net" x="661.0" y="220.0">trigger, GPIO7</text>
<path class="wire" d="M 1010 110 L 1040 110 L 1040 330 L 750 330"/>
<text class="net" x="1046.0" y="224.0">video</text>
<path class="wire" d="M 385 142 L 385 200"/>
<text class="net" x="391.0" y="175.0">GPIO17</text>
<path class="wire" d="M 470 230 L 500 230 L 500 170 L 900 170 L 900 142"/>
<text class="net" x="820.0" y="165.0" text-anchor="middle">reset</text>
<path class="wire" d="M 340 142 L 340 290"/>
<text class="net" x="346.0" y="257.0">GPIO27</text>
<path class="wire" d="M 470 320 L 520 320 L 520 370 L 1100 370 L 1100 96 L 1010 96"/>
<text class="net" x="1106.0" y="237.0">power</text>
<text class="sub" x="24" y="400" text-anchor="start">Scripts are bytes by latch index, so the model (set_pad at the same polls) and the part (the register at the same latches)</text>
<text class="sub" x="24" y="415" text-anchor="start">see one history; the bridge's per-latch log and the model's are diffed latch for latch; a triggered capture is scored through the roundtrip.</text>
<line class="sep" x1="24" y1="435" x2="1176" y2="435"/>
<text class="band" x="24" y="465" text-anchor="start">THE BRIDGE: the register is the pad the console clocks; the ESP32 is never in the nanosecond path</text>
<rect class="chip" x="40" y="520" width="120" height="200" rx="6"/>
<text class="title" x="100.0" y="540" text-anchor="middle">Port header</text>
<line class="wire" x1="160" y1="570" x2="178" y2="570"/>
<text class="pinno" x="181" y="574">7</text>
<text class="pin" x="154" y="574" text-anchor="end">+5 V</text>
<line class="wire" x1="160" y1="600" x2="178" y2="600"/>
<text class="pinno" x="181" y="604">3</text>
<text class="pin" x="154" y="604" text-anchor="end">OUT0</text>
<line class="wire" x1="160" y1="630" x2="178" y2="630"/>
