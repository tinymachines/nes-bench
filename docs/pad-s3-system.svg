<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 740" width="1560" height="740" role="img" aria-label="pad-s3: one original pad, one XIAO ESP32S3, one cell">

  <style>
    text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1f2328; }
    .title { font-size: 15px; font-weight: 700; font-family: ui-sans-serif, system-ui, sans-serif; }
    .sub { font-size: 11px; fill: #57606a; font-family: ui-sans-serif, system-ui, sans-serif; }
    .ref { font-size: 12px; font-weight: 700; }
    .part { font-size: 10px; fill: #57606a; }
    .pin { font-size: 9.5px; }
    .pinno { font-size: 9px; fill: #57606a; }
    .linkflag { fill: #fdf3e3; stroke: #a35c00; stroke-width: 1.1; }
    .linkno { font-size: 9px; fill: #a35c00; font-weight: 700; }
    .net { font-size: 9.5px; fill: #0a5b9c; font-weight: 600; }
    .rail5 { font-size: 9px; fill: #b3261e; font-weight: 700; }
    .rail3 { font-size: 9px; fill: #b35c00; font-weight: 700; }
    .gnd { font-size: 9px; fill: #1f2328; font-weight: 700; }
    .note { font-size: 10px; fill: #57606a; font-family: ui-sans-serif, system-ui, sans-serif; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.3; }
    .offsheet { fill: #eaf3fb; stroke: #0a5b9c; stroke-width: 1.1; }
    .conn { fill: #f3f5f7; stroke: #1f2328; stroke-width: 1.3; }
    .zone { fill: none; stroke: #57606a; stroke-dasharray: 5 4; stroke-width: 1; }
    .lead { stroke: #1f2328; stroke-width: 1; }
    .wire { stroke: #0a5b9c; stroke-width: 1.2; fill: none; }
    .w5 { stroke: #b3261e; stroke-width: 1.2; fill: none; }
    .w3 { stroke: #b35c00; stroke-width: 1.2; fill: none; }
    .wg { stroke: #1f2328; stroke-width: 1.2; fill: none; }
    .lane { stroke: #1f2328; stroke-width: 1.4; fill: none; }
    .lanelbl { font-size: 11px; font-weight: 700; }
    .win { fill: #b3261e; fill-opacity: 0.10; stroke: none; }
    .safe { fill: #1a7f37; fill-opacity: 0.12; stroke: none; }
    .mark { stroke: #0a5b9c; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .auth { font-size: 9px; fill: #b3261e; font-family: ui-sans-serif, system-ui, sans-serif; font-style: italic; }
  </style>

<rect x="0" y="0" width="1560" height="740" fill="#ffffff"/>
<g class="sheet-heading" data-height="60">
<text class="title" x="24" y="30">pad-s3: one original pad, one XIAO ESP32S3, one cell</text>
<text class="sub" x="24" y="46">A USB keyboard when a host configures it, a BLE keyboard when none does: firmware/pad, the sketch the ESP32-P4 kit runs today. AUTHORED 2026-10-13 against Seeed's pin map and the parts on the desk; no XIAO here yet.</text>
</g>
<rect class="zone" x="20" y="66" width="420" height="430" rx="6"/>
<text class="sub" x="28" y="80" text-anchor="start">THE PAD: an original controller, polled at 1 kHz</text>
<rect class="conn" x="120" y="120" width="170" height="180" rx="3"/>
<text class="ref" x="126" y="134" text-anchor="start">J1</text>
<text class="part" x="126" y="146" text-anchor="start">original NES pad</text>
<text class="part" x="121" y="313" text-anchor="start">a 4021 inside; lead colours: TM-NESB-003 sheet 5</text>
<line class="lead" x1="290" y1="176" x2="316" y2="176"/>
<text class="pin" x="285" y="179.5" text-anchor="end">GND</text>
<text class="pinno" x="294" y="174" text-anchor="start">1</text>
<line class="wg" x1="316" y1="176" x2="316" y2="184"/><line class="wg" x1="310" y1="184" x2="322" y2="184"/><line class="wg" x1="313" y1="187" x2="319" y2="187"/>
<line class="lead" x1="290" y1="202" x2="316" y2="202"/>
<text class="pin" x="285" y="205.5" text-anchor="end">CLK</text>
<text class="pinno" x="294" y="200" text-anchor="start">2</text>
<path class="wire" d="M316,202 l6,-6 h53.4 v12 h-53.4 z"/>
<text class="net" x="325" y="205.5" text-anchor="start">PAD_CLK</text>
<line class="lead" x1="290" y1="228" x2="316" y2="228"/>
<text class="pin" x="285" y="231.5" text-anchor="end">OUT0</text>
<text class="pinno" x="294" y="226" text-anchor="start">3</text>
<path class="wire" d="M316,228 l6,-6 h65.80000000000001 v12 h-65.80000000000001 z"/>
<text class="net" x="325" y="231.5" text-anchor="start">PAD_LATCH</text>
<line class="lead" x1="290" y1="254" x2="316" y2="254"/>
<text class="pin" x="285" y="257.5" text-anchor="end">D0</text>
<text class="pinno" x="294" y="252" text-anchor="start">4</text>
<path class="wire" d="M316,254 l6,-6 h47.2 v12 h-47.2 z"/>
<text class="net" x="325" y="257.5" text-anchor="start">PAD_D0</text>
<line class="lead" x1="290" y1="280" x2="316" y2="280"/>
<text class="pin" x="285" y="283.5" text-anchor="end">VCC</text>
<text class="pinno" x="294" y="278" text-anchor="start">5</text>
<line class="w3" x1="316" y1="280" x2="316" y2="271"/><line class="w3" x1="311" y1="271" x2="321" y2="271"/>
<text class="rail3" x="316" y="269" text-anchor="middle">3V3</text>
<text class="note" x="40" y="330" text-anchor="start">poll_pad: OUT0 high 12 us to load, its fall latches,</text>
<text class="note" x="40" y="343" text-anchor="start">eight clocks, D0 read before each rising edge.</text>
<text class="note" x="40" y="356" text-anchor="start">A pressed button reads LOW. Bit 0 is A, the order</text>
<text class="note" x="40" y="369" text-anchor="start">nes_glue::controller::Buttons::as_byte gives.</text>
<text class="note" x="40" y="382" text-anchor="start">The same routine on the bridge, pad-usb, pad-ble</text>
<text class="note" x="40" y="395" text-anchor="start">and pad: one poll, measured on the P4 at 3.3 V.</text>
<rect class="zone" x="460" y="66" width="620" height="430" rx="6"/>
<text class="sub" x="468" y="80" text-anchor="start">THE XIAO: USB and the radio on one die, the charger on the board</text>
<rect class="box" x="620" y="110" width="230" height="206" rx="3"/>
<text class="ref" x="626" y="124" text-anchor="start">U1</text>
<text class="part" x="626" y="136" text-anchor="start">Seeed XIAO ESP32S3</text>
<text class="part" x="621" y="329" text-anchor="start">plain, not Sense; antenna fitted before power</text>
<line class="lead" x1="594" y1="166" x2="620" y2="166"/>
<text class="pin" x="625" y="169.5" text-anchor="start">D3 GPIO4</text>
<path class="wire" d="M594,166 l-6,-6 h-65.80000000000001 v12 h65.80000000000001 z"/>
<text class="net" x="585" y="169.5" text-anchor="end">PAD_LATCH</text>
<line class="lead" x1="594" y1="192" x2="620" y2="192"/>
<text class="pin" x="625" y="195.5" text-anchor="start">D4 GPIO5</text>
<path class="wire" d="M594,192 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="585" y="195.5" text-anchor="end">PAD_CLK</text>
<line class="lead" x1="594" y1="218" x2="620" y2="218"/>
<text class="pin" x="625" y="221.5" text-anchor="start">D5 GPIO6</text>
<path class="wire" d="M594,218 l-6,-6 h-47.2 v12 h47.2 z"/>
<text class="net" x="585" y="221.5" text-anchor="end">PAD_D0</text>
<line class="lead" x1="594" y1="244" x2="620" y2="244"/>
<text class="pin" x="625" y="247.5" text-anchor="start">D8 GPIO7</text>
<path class="wire" d="M594,244 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="585" y="247.5" text-anchor="end">MODE_SW</text>
<line class="lead" x1="594" y1="270" x2="620" y2="270"/>
<text class="pin" x="625" y="273.5" text-anchor="start">3V3</text>
<line class="w3" x1="594" y1="270" x2="594" y2="261"/><line class="w3" x1="589" y1="261" x2="599" y2="261"/>
<text class="rail3" x="594" y="259" text-anchor="middle">3V3</text>
<line class="lead" x1="594" y1="296" x2="620" y2="296"/>
<text class="pin" x="625" y="299.5" text-anchor="start">GND</text>
<line class="wg" x1="594" y1="296" x2="594" y2="304"/><line class="wg" x1="588" y1="304" x2="600" y2="304"/><line class="wg" x1="591" y1="307" x2="597" y2="307"/>
<line class="lead" x1="850" y1="166" x2="876" y2="166"/>
<text class="pin" x="845" y="169.5" text-anchor="end">USB-C</text>
<path class="wire" d="M876,166 l6,-6 h34.8 v12 h-34.8 z"/>
<text class="net" x="885" y="169.5" text-anchor="start">HOST</text>
<line class="lead" x1="850" y1="192" x2="876" y2="192"/>
<text class="pin" x="845" y="195.5" text-anchor="end">BAT+</text>
<path class="wire" d="M876,192 l6,-6 h41.0 v12 h-41.0 z"/>
<text class="net" x="885" y="195.5" text-anchor="start">CELL+</text>
<line class="lead" x1="850" y1="218" x2="876" y2="218"/>
<text class="pin" x="845" y="221.5" text-anchor="end">BAT-</text>
<path class="wire" d="M876,218 l6,-6 h41.0 v12 h-41.0 z"/>
<text class="net" x="885" y="221.5" text-anchor="start">CELL-</text>
<line class="lead" x1="850" y1="244" x2="876" y2="244"/>
<text class="pin" x="845" y="247.5" text-anchor="end">BLE 5</text>
<path class="wire" d="M876,244 l6,-6 h28.6 v12 h-28.6 z"/>
<text class="net" x="885" y="247.5" text-anchor="start">AIR</text>
<text class="note" x="480" y="350" text-anchor="start">THE SINK FOLLOWS THE HOST (measured on the P4): a host configures the device</text>
<text class="note" x="480" y="363" text-anchor="start">within 1.5 s: USB, and the radio never starts. No host: BLE. A host arriving later</text>
<text class="note" x="480" y="376" text-anchor="start">takes the reports; a host gone 2 s hands them back to BLE. SW1 low at boot: BLE</text>
<text class="note" x="480" y="389" text-anchor="start">regardless, so the pad can charge from a PC without the PC taking the keyboard.</text>
<path class="wire" d="M500,450 l-6,-6 h-47.2 v12 h47.2 z"/>
<text class="net" x="491" y="453.5" text-anchor="end">PAD_D0</text>
<line class="lead" x1="500" y1="450" x2="518" y2="450"/><rect class="box" x="518" y="443" width="44" height="14"/><line class="lead" x1="562" y1="450" x2="580" y2="450"/>
<text class="pinno" x="540" y="440" text-anchor="middle">R1</text>
<text class="pin" x="540" y="454" text-anchor="middle">10k</text>
<line class="w3" x1="580" y1="450" x2="580" y2="441"/><line class="w3" x1="575" y1="441" x2="585" y2="441"/>
<text class="rail3" x="580" y="439" text-anchor="middle">3V3</text>
<path class="wire" d="M760,450 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="751" y="453.5" text-anchor="end">MODE_SW</text>
<line class="lead" x1="760" y1="450" x2="778" y2="450"/><rect class="box" x="778" y="443" width="44" height="14"/><line class="lead" x1="822" y1="450" x2="840" y2="450"/>
<text class="pinno" x="800" y="440" text-anchor="middle">SW1</text>
<text class="pin" x="800" y="454" text-anchor="middle">mode</text>
<line class="wg" x1="840" y1="450" x2="840" y2="458"/><line class="wg" x1="834" y1="458" x2="846" y2="458"/><line class="wg" x1="837" y1="461" x2="843" y2="461"/>
<rect class="zone" x="1100" y="66" width="440" height="430" rx="6"/>
<text class="sub" x="1108" y="80" text-anchor="start">THE CELL: on the XIAO's own charger</text>
<rect class="conn" x="1180" y="110" width="200" height="102" rx="3"/>
<text class="ref" x="1186" y="124" text-anchor="start">BT1</text>
<text class="part" x="1186" y="136" text-anchor="start">LiPo 3.7 V 2000 mAh</text>
<text class="part" x="1181" y="225" text-anchor="start">JST lead; 7.4 Wh on the label</text>
<line class="lead" x1="1380" y1="166" x2="1406" y2="166"/>
<text class="pin" x="1375" y="169.5" text-anchor="end">+</text>
<path class="wire" d="M1406,166 l6,-6 h41.0 v12 h-41.0 z"/>
<text class="net" x="1415" y="169.5" text-anchor="start">CELL+</text>
<line class="lead" x1="1380" y1="192" x2="1406" y2="192"/>
<text class="pin" x="1375" y="195.5" text-anchor="end">-</text>
<path class="wire" d="M1406,192 l6,-6 h41.0 v12 h-41.0 z"/>
<text class="net" x="1415" y="195.5" text-anchor="start">CELL-</text>
<text class="note" x="1120" y="250" text-anchor="start">OPTION A (drawn): the cell on the BAT pads. The</text>
<text class="note" x="1120" y="263" text-anchor="start">XIAO charges it from its socket and runs from it</text>
<text class="note" x="1120" y="276" text-anchor="start">with the socket empty. Seeed's table says 100 mA</text>
<text class="note" x="1120" y="289" text-anchor="start">fast charge, so an empty cell is a day on charge.</text>
<text class="note" x="1120" y="302" text-anchor="start"></text>
<text class="note" x="1120" y="315" text-anchor="start">OPTION B (in the drawer): a TP4056 USB-C board</text>
<text class="note" x="1120" y="328" text-anchor="start">with the DW01 protection pair. Its OUT is the</text>
<text class="note" x="1120" y="341" text-anchor="start">cell's own voltage, too low for the 5V pin, and</text>
<text class="note" x="1120" y="354" text-anchor="start">two chargers on one cell is one too many. It</text>
<text class="note" x="1120" y="367" text-anchor="start">earns a place only if the cell turns out to have</text>
<text class="note" x="1120" y="380" text-anchor="start">no protection of its own, or 100 mA is too slow.</text>
<text class="note" x="1120" y="393" text-anchor="start">DECIDE AT THE BENCH WITH A METER.</text>
<rect class="zone" x="20" y="512" width="1520" height="210" rx="6"/>
<text class="sub" x="28" y="526" text-anchor="start">WHAT IS MEASURED, WHAT IS AUTHORED, WHAT IS NEXT</text>
<text class="pin" x="40" y="542" text-anchor="start">MEASURED</text>
<text class="pin" x="150" y="542" text-anchor="start">firmware/pad on the ESP32-P4 kit, 2026-10-13: USB typed into a laptop, BLE typed into an iPhone, one binary;</text>
<text class="pin" x="150" y="557" text-anchor="start">the pad at 3.3 V; both report shapes held to each other on the desk (82 checks per ID).</text>
<text class="pin" x="40" y="575" text-anchor="start">AUTHORED</text>
<text class="pin" x="150" y="575" text-anchor="start">every XIAO pin number (Seeed's map, read 2026-10-13); the cell on the BAT pads; the charge current; the S3's</text>
<text class="pin" x="150" y="590" text-anchor="start">secure-connections pairing (the P4 needed legacy because its radio is a second chip over SDIO; the S3's is not).</text>
<text class="pin" x="40" y="608" text-anchor="start">COMPILES</text>
<text class="pin" x="150" y="608" text-anchor="start">firmware/pad for esp32s3, USBMode=default, 49 percent of the default app partition.</text>
<text class="pin" x="40" y="626" text-anchor="start">NEXT</text>
<text class="pin" x="150" y="626" text-anchor="start">a XIAO arrives: lsusb shows 303a on its socket before anything is flashed; flash pad; a host sees a keyboard;</text>
<text class="pin" x="150" y="641" text-anchor="start">then no host, the radio, a phone pairs with SC; then the cell on the pads, the socket's current in and out.</text>
<text class="pin" x="40" y="659" text-anchor="start">TRAP</text>
<text class="pin" x="150" y="659" text-anchor="start">the XIAO's one socket is the keyboard once TinyUSB takes it: the log is on D6/D7, flashing is BOOT held across a reset.</text>
</svg>