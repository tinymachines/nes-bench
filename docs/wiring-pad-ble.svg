<g class="sheet-heading" data-height="60">
<text class="title" x="24.0" y="30.0" text-anchor="start">pad-ble v1: two original pads into an ESP32-C6, at right angles</text>
<text class="sub" x="24.0" y="46.0" text-anchor="start">The standalone adapter, every wire read out of pad-ble.svg. Both pads share the latch and the clock, so those two nets reach four pins each. The pads run from 3V3, not 5 V, which is measure-first item 4.</text>
</g>
