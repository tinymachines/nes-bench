 .wire{fill:none;stroke-width:2.2;stroke-linejoin:miter}
 .railline{fill:none;stroke-width:3}
 .notch{fill:#fff;stroke:#222;stroke-width:1.2}
</style>
<rect x="0" y="0" width="1209" height="531" fill="#ffffff"/>
<g class="sheet-heading" data-height="60">
<text class="title" x="24.0" y="30.0" text-anchor="start">pad-ble v1: two original pads into an ESP32-C6, at right angles</text>
<text class="sub" x="24.0" y="46.0" text-anchor="start">The standalone adapter, every wire read out of pad-ble.svg. One pad, because a keyboard report has six key slots. The pad runs from 3V3, not 5 V, which is measure-first item 4.</text>
</g>
