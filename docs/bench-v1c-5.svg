<text class="note" x="48.0" y="489.0" text-anchor="start">K1 is the 5 V coil part the module carried (SRD-05VDC, about 70 ohms, 71 mA), on the</text>
<text class="note" x="48.0" y="502.0" text-anchor="start">Pi's 5 V pin as before. Q1 switches its low side; R4 gives it about 5.5 mA of base, R5</text>
<text class="note" x="48.0" y="515.0" text-anchor="start">holds it off while the Pi boots and GPIO27 floats, and D1 (cathode on PI_5V) takes the</text>
<text class="note" x="48.0" y="528.0" text-anchor="start">coil's kick. GPIO27 high closes COM to NO: the module's measured sense, kept.</text>
<text class="note" x="542.4000000000001" y="489.0" text-anchor="start">K1's contact is in parallel with the front panel's power switch: COM on brown, NO on</text>
<text class="note" x="542.4000000000001" y="502.0" text-anchor="start">red (sheet 4). The adapter's low voltage and the console's current, never mains; the</text>
<text class="note" x="542.4000000000001" y="515.0" text-anchor="start">front switch stays OFF while the head runs the power. K1 shares nothing with its coil.</text>
<text class="note" x="542.4000000000001" y="528.0" text-anchor="start">MAINS SAFETY: nothing on this sheet is ever on the mains side.</text>
</svg>