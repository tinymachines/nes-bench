<text class="note" x="277.0" y="475.0" text-anchor="start">The pins are v1b's (bench-v1b-uno.md, UNO pins): D5 is Timer1's T1,</text>
<text class="note" x="277.0" y="488.0" text-anchor="start">D2 is INT0, D3 the trigger, D10 RCLK, D11 and D13 the SPI to U3, D6 to</text>
<text class="note" x="277.0" y="501.0" text-anchor="start">D8 the bridge's own pad. The serial to the Pi stays on the UNO's USB;</text>
<text class="note" x="277.0" y="514.0" text-anchor="start">the shield touches no D0 or D1. R1's far end goes to TP1 (sheet 3).</text>
