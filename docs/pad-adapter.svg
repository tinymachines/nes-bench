<text class="note" x="340" y="100" text-anchor="start">The pad's 4021 is a CMOS part rated 3 to 18 V.</text>
<text class="note" x="340" y="113" text-anchor="start">At 3V3 its D0 is 3V3 logic and needs no shifter.</text>
<text class="note" x="340" y="126" text-anchor="start">Measure-first item 4 on the bench settles this</text>
<text class="note" x="340" y="139" text-anchor="start">before any adapter is built; if a pad will not run</text>
<text class="note" x="340" y="152" text-anchor="start">at 3V3, add a 74LVC245 and feed the pad 5 V.</text>
<text class="note" x="340" y="165" text-anchor="start"></text>
<text class="note" x="340" y="178" text-anchor="start">Poll: OUT0 high 12 us, low, 8 clocks at 1 us,</text>
<text class="note" x="340" y="191" text-anchor="start">read D0 before each rising edge. 1 kHz.</text>
<text class="note" x="340" y="204" text-anchor="start">The same poll_pad() as firmware/bridge/bridge.ino.</text>
<path class="wire" d="M400,300 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="391" y="303.5" text-anchor="end">PAD1_D0</text>
<line class="lead" x1="400" y1="300" x2="418" y2="300"/><rect class="box" x="418" y="293" width="44" height="14"/><line class="lead" x1="462" y1="300" x2="480" y2="300"/>
<text class="pinno" x="440" y="290" text-anchor="middle">R1..R2</text>
<text class="pin" x="440" y="304" text-anchor="middle">10k</text>
<line class="w3" x1="480" y1="300" x2="480" y2="291"/><line class="w3" x1="475" y1="291" x2="485" y2="291"/>
<text class="rail3" x="480" y="289" text-anchor="middle">3V3</text>
<text class="note" x="340" y="330" text-anchor="start">pullups on D0 (both pads): unplugged reads 'nothing pressed'</text>
<rect class="zone" x="760" y="60" width="920" height="560" rx="6"/>
