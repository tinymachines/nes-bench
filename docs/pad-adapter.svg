<rect x="0" y="0" width="1700" height="940" fill="#ffffff"/>
<text class="title" x="24" y="30">OG pad to BLE / USB HID adapter: the bridge's pad poll, made portable</text>
<text class="sub" x="24" y="46">ESP32-S3 for USB HID + BLE; ESP32-C6 works for BLE only (its USB port is serial/JTAG, not a device controller). Nothing built.</text>
<rect class="zone" x="20" y="60" width="720" height="560" rx="6"/>
<text class="sub" x="28" y="74" text-anchor="start">PADS, polled at 3V3 exactly as the bridge polls them</text>
