<text class="note" x="800" y="540" text-anchor="start">Power: on USB, VBUS feeds the devkit and charges the cell; unplugged, the cell through</text>
<text class="note" x="800" y="553" text-anchor="start">the LDO. A 500 mAh cell runs an S3 in BLE modem sleep for a day (authored; measure).</text>
<text class="note" x="800" y="566" text-anchor="start">Skip the battery entirely for a USB-only cable adapter: the S3 devkit alone is the whole thing.</text>
<rect class="zone" x="20" y="640" width="1660" height="290" rx="6"/>
<text class="sub" x="28" y="654" text-anchor="start">WHAT THE HOST SEES</text>
<text class="pin" x="40" y="675" text-anchor="start">Keyboard mode   BLE HID keyboard (or USB HID keyboard). Buttons map to keys: A=x B=z Select=RShift Start=Enter D-pad=arrows (configurable).</text>
<text class="pin" x="40" y="688" text-anchor="start">                Works with any phone, tablet or PC, browser emulators included, with no game-controller support needed. iOS accepts BLE keyboards natively.</text>
<text class="pin" x="40" y="701" text-anchor="start">Gamepad mode    BLE HID gamepad report (8 buttons + hat). Android, Windows, Linux, macOS and Steam take generic HID gamepads;</text>
<text class="pin" x="40" y="714" text-anchor="start">                iOS only takes MFi, Xbox and PlayStation layouts, so keyboard mode is the iOS answer. USB HID gamepad on the S3 works everywhere.</text>
<text class="pin" x="40" y="727" text-anchor="start">Bench mode      Wi-Fi: the adapter streams pad bytes over UDP to the head at 1 kHz, keyed by its own poll count. The head schedules them as AT lines</text>
<text class="pin" x="40" y="740" text-anchor="start">                onto the bridge, so a hand on a wireless pad becomes a scripted, logged, replayable history. Same L format, one more source.</text>
<text class="pin" x="40" y="753" text-anchor="start">Two pads        one adapter, two HID interfaces (or two report IDs); both polled on the shared latch and clock.</text>
<text class="pin" x="40" y="766" text-anchor="start">Latency         1 kHz poll + BLE 7.5 ms connection interval: 8 to 10 ms authored; USB HID 1 ms polling: ~2 ms authored. Measure with the bench's own trigger.</text>
</svg>