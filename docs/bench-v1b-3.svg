<text class="pin" x="874.4000000000001" y="255.5" text-anchor="start">5 white, LED</text>
<text class="pinno" x="865.4000000000001" y="250.0" text-anchor="end">5</text>
<line class="lead" x1="840.4000000000001" y1="249.0" x2="846.4000000000001" y2="255.0"/><line class="lead" x1="840.4000000000001" y1="255.0" x2="846.4000000000001" y2="249.0"/>
<text class="note" x="48.0" y="561.0" text-anchor="start">J3 is five ways straight through, colour for colour with the front panel's harness, pin 1 at</text>
<text class="note" x="48.0" y="574.0" text-anchor="start">the back (lab/06-breakout-map-power-reset.jpg), tapped in parallel with the front panel.</text>
<text class="note" x="48.0" y="587.0" text-anchor="start">Metered unpowered by the user: 1 brown and 2 red are the power switch; 3 orange and 4 yellow</text>
<text class="note" x="48.0" y="600.0" text-anchor="start">the reset button; 4 yellow and 5 white the LED. No pin is ground: the front panel is grounded</text>
<text class="note" x="48.0" y="613.0" text-anchor="start">by its pad and the metal housing. OK1's output is a transistor and has a polarity. MEASURED</text>
<text class="note" x="48.0" y="626.0" text-anchor="start">2026-09-17, console on and the button released: orange sits 4.40 V above yellow, so OUT goes</text>
<text class="note" x="48.0" y="639.0" text-anchor="start">on orange and GND on yellow. Held, the button reads about 200 ohms between them, which a</text>
<text class="note" x="48.0" y="652.0" text-anchor="start">saturated transistor beats. GPIO17 high closes OK1: the reset button, pressed by the head.</text>
<text class="note" x="580.2" y="561.0" text-anchor="start">K1's contact is in parallel with the front panel's power switch: COM on brown, NO on red</text>
<text class="note" x="580.2" y="574.0" text-anchor="start">(a contact has no polarity). Either closes the console's supply, so the front switch stays</text>
<text class="note" x="580.2" y="587.0" text-anchor="start">OFF while the head runs the power, and does the power by hand while the relay rests open.</text>
<text class="note" x="580.2" y="600.0" text-anchor="start">GPIO27 low closes K1; the Pi's boot config holds GPIO27 high, so the relay rests open from</text>
<text class="note" x="580.2" y="613.0" text-anchor="start">power-up. Coil from the Pi's 5 V pin (position 2), about 80 mA; GND is position 6.</text>
<text class="note" x="580.2" y="626.0" text-anchor="start">The pair carries the adapter's low voltage and the console's current, well inside the</text>
<text class="note" x="580.2" y="639.0" text-anchor="start">contact's 10 A. MAINS SAFETY: nothing on this sheet is ever on the mains side.</text>
</svg>