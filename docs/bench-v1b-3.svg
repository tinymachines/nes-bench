<g class="sheet-heading" data-height="60">
<text class="title" x="24" y="30">nes-bench bridge v1b: the UNO version, one supply, one port  (sheet 3 of 3: the head's hands, bring-up 6.2 and 6.3)</text>
<text class="sub" x="24" y="46">reset and power from the Pi's header through two modules; the Pi's ground reaches the console through the UNO's USB lead only. Added 2026-09-15.</text>
</g>
