<text class="note" x="48.0" y="561.0" text-anchor="start">J3, the power and reset breakout: five ways straight through, colour for colour with</text>
<text class="note" x="48.0" y="574.0" text-anchor="start">the front panel's harness, 1 brown 2 red 3 orange 4 yellow 5 white, pin 1 at the back</text>
<text class="note" x="48.0" y="587.0" text-anchor="start">(lab/06-breakout-map-power-reset.jpg). The reset pair is two of the five. Console on,</text>
<text class="note" x="48.0" y="600.0" text-anchor="start">meter each way to the port's GND: the ground pad reads 0 V; the pulled-up pad reads</text>
<text class="note" x="48.0" y="613.0" text-anchor="start">about 5 V and drops to 0 V while the reset button is held. Step 6.2 asks for both and</text>
<text class="note" x="48.0" y="626.0" text-anchor="start">writes them in the lab log; nothing here guesses them. OK1 OUT lands on the pulled-up</text>
<text class="note" x="48.0" y="639.0" text-anchor="start">way, OK1 GND on the ground way, VCC open. GPIO17 high holds the pad low for 100 ms:</text>
<text class="note" x="48.0" y="652.0" text-anchor="start">the button, pressed by the head. INPUT - is the Pi's ground; OUT and GND are the console's.</text>
<text class="note" x="569.4000000000001" y="561.0" text-anchor="start">The console's own switch stays latched ON; K1 is the switch. Cut ONE conductor of</text>
<text class="note" x="569.4000000000001" y="574.0" text-anchor="start">the adapter's low-voltage cable and put NO and COM in the cut; the other conductor</text>
<text class="note" x="569.4000000000001" y="587.0" text-anchor="start">stays whole. The original adapter gives 9 V AC, a replacement often 9 V DC; the</text>
<text class="note" x="569.4000000000001" y="600.0" text-anchor="start">contact takes either. GPIO27 low turns the relay on. NO is open with the Pi off or</text>
<text class="note" x="569.4000000000001" y="613.0" text-anchor="start">rebooting, so the console's rest state is OFF, which is what the head wants.</text>
<text class="note" x="569.4000000000001" y="626.0" text-anchor="start">Coil from the Pi's 5 V pin (position 2), about 80 mA; GND is position 6.</text>
<text class="note" x="569.4000000000001" y="639.0" text-anchor="start">MAINS SAFETY: never the mains side, never both leads. Step 6.3 refuses to run</text>
<text class="note" x="569.4000000000001" y="652.0" text-anchor="start">until the operator has said the contact is on the adapter side.</text>
</svg>