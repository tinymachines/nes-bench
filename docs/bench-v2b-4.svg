<text class="title" x="24" y="30">nes-bench bridge v2b: the UNO version, two ports, sync counted, one supply  (sheet 4 of 4: sync, the pads and the trigger)</text>
<text class="sub" x="24" y="46">v1b plus a second 165/595 pair on the same SPI chain and an LM1881 whose 5 V outputs go straight into the UNO. 2026-09-09. Not built.</text>
