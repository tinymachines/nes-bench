<text class="net" x="728.1999999999999" y="426.5" text-anchor="start">EXT_TRIG</text>
<text class="note" x="48.0" y="516.0" text-anchor="start">C7 AC couples the console's video, tapped after Q1 at the AUX/RF</text>
<text class="note" x="48.0" y="529.0" text-anchor="start">input with a 1k series resistor: the point the scope already probes.</text>
<text class="note" x="48.0" y="542.0" text-anchor="start">VSYNC: one falling edge per field, 60.0988/s.</text>
<text class="note" x="48.0" y="555.0" text-anchor="start">CSYNC: one per line plus the vsync block. The NES emits no</text>
<text class="note" x="48.0" y="568.0" text-anchor="start">serrations, so the count per field is lines minus k, and k is</text>
<text class="note" x="48.0" y="581.0" text-anchor="start">measured rather than assumed.</text>
<text class="note" x="445.20000000000005" y="516.0" text-anchor="start">R1 goes to the DS1054Z's rear EXT TRIG. Check the input's rating</text>
<text class="note" x="445.20000000000005" y="529.0" text-anchor="start">first; if 5 V exceeds it, a 2:1 divider (two 1k) after R1.</text>
<text class="note" x="445.20000000000005" y="542.0" text-anchor="start">Both pads are polled by the same PAD_LATCH and PAD_CLK and answer</text>
<text class="note" x="445.20000000000005" y="555.0" text-anchor="start">on their own D0, so one poll reads both. They are the pad halves</text>
<text class="note" x="445.20000000000005" y="568.0" text-anchor="start">of two cut controller cables, and they run at the 5 V they were</text>
