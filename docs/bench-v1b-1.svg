<text class="pinno" x="104.0" y="491.0" text-anchor="middle">C1..C3</text>
<text class="pin" x="104.0" y="505.0" text-anchor="middle">100nF</text>
<line class="wg" x1="144.0" y1="501.0" x2="144.0" y2="509.0"/><line class="wg" x1="138.0" y1="509.0" x2="150.0" y2="509.0"/><line class="wg" x1="141.0" y1="512.0" x2="147.0" y2="512.0"/>
<text class="note" x="190.0" y="501.0" text-anchor="start">one 100nF across each of U1, U2 and U3,</text>
<text class="note" x="190.0" y="514.0" text-anchor="start">at the chip's own supply pins</text>
<text class="note" x="430.6" y="501.0" text-anchor="start">OUT0 high: U1 drives /PL low and the 165 loads its eight inputs. It is transparent while low,</text>
<text class="note" x="430.6" y="514.0" text-anchor="start">so the byte must already be in U3 (sheet 2). OUT0 falls, /PL goes high, the byte is held, and</text>
<text class="note" x="430.6" y="527.0" text-anchor="start">QH shows A. Each CLK rising edge shifts the next bit out: B, Select, Start, Up, Down, Left,</text>
<text class="note" x="430.6" y="540.0" text-anchor="start">Right, then DS = GND, so the ninth read and later return 1 as an original pad does.</text>
<text class="note" x="430.6" y="553.0" text-anchor="start">Pressed is LOW, which is what the pad's own 4021 drives.</text>
</svg>