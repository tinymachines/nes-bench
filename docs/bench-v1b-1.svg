<g class="sheet-heading" data-height="60">
<text class="title" x="24" y="30">nes-bench bridge v1b: the UNO version, one supply, one port  (sheet 1 of 2: the console side)</text>
<text class="sub" x="24" y="46">the ATmega328 is a 5 V part, so the register, the pad and the console share one domain. 2026-09-08. Not built; pulse widths authored until B0.</text>
</g>
