<text class="note" x="48.0" y="496.0" text-anchor="start">OUT0 high: U1 drives /PL1 low and U2 loads its eight inputs. It is transparent while low, so the</text>
<text class="note" x="48.0" y="509.0" text-anchor="start">byte must already be on U5's outputs (sheet 3). OUT0 falls, /PL1 goes high, the byte is held, and</text>
<text class="note" x="48.0" y="522.0" text-anchor="start">QH shows A. Each CLK rising edge shifts the next bit out. DS to GND means the ninth read and</text>
<text class="note" x="48.0" y="535.0" text-anchor="start">later return 1 to the console, which is what an original pad does. Pressed is LOW.</text>
<text class="note" x="48.0" y="548.0" text-anchor="start">Port 2 is the same circuit on sheet 2. It shares this inverter, U1's second channel, and</text>
<text class="note" x="48.0" y="561.0" text-anchor="start">the SPI chain; it has its own register, its own pad and its own D0.</text>
</svg>