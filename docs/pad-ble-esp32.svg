<rect x="0" y="0" width="1560" height="1060" fill="#ffffff"/>
<g class="sheet-heading" data-height="60">
<text class="title" x="24" y="30">pad-ble v1 on a classic ESP32: one pad into a WROOM-32 devkit, as a BLE keyboard</text>
<text class="sub" x="24" y="46">The BLE build, on the part with its own radio. A 30-pin ESP32-WROOM-32 devkit, header read off the board 2026-09-30. NOT the C6 map: GPIO6 is this module's flash and GPIO3 its console, so the pad moves to D25, D26, D27.</text>
</g>
<rect class="zone" x="20" y="66" width="690" height="700" rx="6"/>
<text class="sub" x="28" y="80" text-anchor="start">THE PAD, polled at 3V3 exactly as the bridge polls one</text>
<rect class="conn" x="150" y="100" width="170.0" height="232" rx="3"/>
<text class="ref" x="156" y="114" text-anchor="start">J1</text>
<text class="part" x="156" y="126" text-anchor="start">original NES pad (MN4021B)</text>
<text class="part" x="151" y="345" text-anchor="start">1 brown  2 red  3 orange  4 yellow  5 white, NOT measured</text>
<line class="lead" x1="124" y1="156" x2="150" y2="156"/>
<text class="pin" x="155" y="159.5" text-anchor="start">GND</text>
<text class="pinno" x="146" y="154" text-anchor="end">1</text>
<line class="wg" x1="124" y1="156" x2="124" y2="164"/><line class="wg" x1="118" y1="164" x2="130" y2="164"/><line class="wg" x1="121" y1="167" x2="127" y2="167"/>
<line class="lead" x1="124" y1="182" x2="150" y2="182"/>
<text class="pin" x="155" y="185.5" text-anchor="start">CLK</text>
<text class="pinno" x="146" y="180" text-anchor="end">2</text>
<path class="wire" d="M124,182 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="115" y="185.5" text-anchor="end">PAD_CLK</text>
<line class="lead" x1="124" y1="208" x2="150" y2="208"/>
<text class="pin" x="155" y="211.5" text-anchor="start">OUT0</text>
<text class="pinno" x="146" y="206" text-anchor="end">3</text>
<path class="wire" d="M124,208 l-6,-6 h-65.80000000000001 v12 h65.80000000000001 z"/>
<text class="net" x="115" y="211.5" text-anchor="end">PAD_LATCH</text>
<line class="lead" x1="124" y1="234" x2="150" y2="234"/>
<text class="pin" x="155" y="237.5" text-anchor="start">D0</text>
<text class="pinno" x="146" y="232" text-anchor="end">4</text>
<path class="wire" d="M124,234 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="115" y="237.5" text-anchor="end">PAD1_D0</text>
<line class="lead" x1="124" y1="260" x2="150" y2="260"/>
<text class="pin" x="155" y="263.5" text-anchor="start">+5V</text>
<text class="pinno" x="146" y="258" text-anchor="end">5</text>
<line class="w3" x1="124" y1="260" x2="124" y2="251"/><line class="w3" x1="119" y1="251" x2="129" y2="251"/>
<text class="rail3" x="124" y="249" text-anchor="middle">3V3</text>
<line class="lead" x1="124" y1="286" x2="150" y2="286"/>
<text class="pin" x="155" y="289.5" text-anchor="start">n/c</text>
<text class="pinno" x="146" y="284" text-anchor="end">6</text>
<line class="lead" x1="121" y1="283" x2="127" y2="289"/><line class="lead" x1="121" y1="289" x2="127" y2="283"/>
<line class="lead" x1="124" y1="312" x2="150" y2="312"/>
<text class="pin" x="155" y="315.5" text-anchor="start">n/c</text>
<text class="pinno" x="146" y="310" text-anchor="end">7</text>
<line class="lead" x1="121" y1="309" x2="127" y2="315"/><line class="lead" x1="121" y1="315" x2="127" y2="309"/>
<text class="note" x="330" y="110" text-anchor="start">The pad side is the P4 sheet's: the same plug, pullup and poll.</text>
<text class="note" x="330" y="123" text-anchor="start">Only the three pins it lands on move, because this part gives</text>
<text class="note" x="330" y="136" text-anchor="start">no choice (see the controller zone).</text>
<text class="note" x="330" y="149" text-anchor="start"></text>
<text class="note" x="330" y="162" text-anchor="start">The pad's 4021 is a CMOS part rated 3 to 18 V, so at 3V3 its D0</text>
<text class="note" x="330" y="175" text-anchor="start">is 3V3 logic and needs no shifter. MEASURED 2026-09-27: an</text>
<text class="note" x="330" y="188" text-anchor="start">original's MN4021B follows its buttons at 3V3 (pad-ble-p4.svg).</text>
<text class="note" x="330" y="201" text-anchor="start">Pin 5 is the supply; 6 and 7 carry nothing. RING THE CABLE OUT</text>
<text class="note" x="330" y="214" text-anchor="start">UNPLUGGED. A 10 ohm part fitted as the 10k hid it first.</text>
<text class="note" x="330" y="227" text-anchor="start"></text>
<text class="note" x="330" y="240" text-anchor="start">J1 IS DRAWN AS AN ORIGINAL PAD, in Nintendo's colours, NOT YET</text>
<text class="note" x="330" y="253" text-anchor="start">MEASURED: beep each wire to the MN4021B first. A REPLICA's differ,</text>
<text class="note" x="330" y="266" text-anchor="start">and RED and YELLOW are different signals on each: wired by the</text>
<text class="note" x="330" y="279" text-anchor="start">replica's colours, an original puts its DATA on the GROUND rail.</text>
<text class="note" x="330" y="292" text-anchor="start">NO PAD IS WIRED TO THIS BOARD YET. With D27 floating the byte</text>
<text class="note" x="330" y="305" text-anchor="start">reads ff, all eight pressed, and the blue LED on D2 is on.</text>
<path class="wire" d="M330,690 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="321" y="693.5" text-anchor="end">PAD1_D0</text>
<line class="lead" x1="330" y1="690" x2="348" y2="690"/><rect class="box" x="348" y="683" width="44" height="14"/><line class="lead" x1="392" y1="690" x2="410" y2="690"/>
<text class="pinno" x="370" y="680" text-anchor="middle">R1</text>
<text class="pin" x="370" y="694" text-anchor="middle">10k</text>
<line class="w3" x1="410" y1="690" x2="410" y2="681"/><line class="w3" x1="405" y1="681" x2="415" y2="681"/>
<text class="rail3" x="410" y="679" text-anchor="middle">3V3</text>
<rect class="zone" x="730" y="66" width="810" height="700" rx="6"/>
<text class="sub" x="738" y="80" text-anchor="start">THE CONTROLLER, on its own USB power, labels as the board prints them</text>
<rect class="box" x="900" y="100" width="210" height="232" rx="3"/>
<text class="ref" x="906" y="114" text-anchor="start">U1</text>
<text class="part" x="906" y="126" text-anchor="start">ESP32-WROOM-32 devkit</text>
<text class="part" x="901" y="345" text-anchor="start">30 pins; the labels are the board's own silkscreen; D&lt;n> is GPIO&lt;n></text>
<line class="lead" x1="874" y1="156" x2="900" y2="156"/>
<text class="pin" x="905" y="159.5" text-anchor="start">D25</text>
<path class="wire" d="M874,156 l-6,-6 h-65.80000000000001 v12 h65.80000000000001 z"/>
<text class="net" x="865" y="159.5" text-anchor="end">PAD_LATCH</text>
<line class="lead" x1="874" y1="182" x2="900" y2="182"/>
<text class="pin" x="905" y="185.5" text-anchor="start">D26</text>
<path class="wire" d="M874,182 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="865" y="185.5" text-anchor="end">PAD_CLK</text>
<line class="lead" x1="874" y1="208" x2="900" y2="208"/>
<text class="pin" x="905" y="211.5" text-anchor="start">D27</text>
<path class="wire" d="M874,208 l-6,-6 h-53.4 v12 h53.4 z"/>
<text class="net" x="865" y="211.5" text-anchor="end">PAD1_D0</text>
<line class="lead" x1="874" y1="234" x2="900" y2="234"/>
<text class="pin" x="905" y="237.5" text-anchor="start">D4</text>
<line class="lead" x1="871" y1="231" x2="877" y2="237"/><line class="lead" x1="871" y1="237" x2="877" y2="231"/>
<line class="lead" x1="874" y1="260" x2="900" y2="260"/>
<text class="pin" x="905" y="263.5" text-anchor="start">D2</text>
<line class="lead" x1="871" y1="257" x2="877" y2="263"/><line class="lead" x1="871" y1="263" x2="877" y2="257"/>
<line class="lead" x1="874" y1="286" x2="900" y2="286"/>
<text class="pin" x="905" y="289.5" text-anchor="start">3V3</text>
<line class="w3" x1="874" y1="286" x2="874" y2="277"/><line class="w3" x1="869" y1="277" x2="879" y2="277"/>
<text class="rail3" x="874" y="275" text-anchor="middle">3V3</text>
<line class="lead" x1="874" y1="312" x2="900" y2="312"/>
<text class="pin" x="905" y="315.5" text-anchor="start">GND</text>
<line class="wg" x1="874" y1="312" x2="874" y2="320"/><line class="wg" x1="868" y1="320" x2="880" y2="320"/><line class="wg" x1="871" y1="323" x2="877" y2="323"/>
<line class="lead" x1="1110" y1="156" x2="1136" y2="156"/>
<text class="pin" x="1105" y="159.5" text-anchor="end">BLE</text>
<path class="offsheet" d="M1136 148 L1167.0 148 L1175.0 156 L1167.0 164 L1136 164 Z"/>
<text class="net" x="1141" y="159.5" text-anchor="start">radio</text>
<line class="lead" x1="1110" y1="182" x2="1136" y2="182"/>
<text class="pin" x="1105" y="185.5" text-anchor="end">micro-USB</text>
<path class="offsheet" d="M1136 174 L1160.8 174 L1168.8 182 L1160.8 190 L1136 190 Z"/>
<text class="net" x="1141" y="185.5" text-anchor="start">VBUS</text>
<line class="w3" x1="820" y1="430" x2="820" y2="421"/><line class="w3" x1="815" y1="421" x2="825" y2="421"/>
<text class="rail3" x="820" y="419" text-anchor="middle">3V3</text>
<line class="lead" x1="820" y1="430" x2="838" y2="430"/><rect class="box" x="838" y="423" width="44" height="14"/><line class="lead" x1="882" y1="430" x2="900" y2="430"/>
<text class="pinno" x="860" y="420" text-anchor="middle">C1</text>
<text class="pin" x="860" y="434" text-anchor="middle">100nF</text>
<line class="wg" x1="900" y1="430" x2="900" y2="438"/><line class="wg" x1="894" y1="438" x2="906" y2="438"/><line class="wg" x1="897" y1="441" x2="903" y2="441"/>
<text class="note" x="760" y="470" text-anchor="start">WHY NOT GPIO2, 3 AND 6. On an ESP32-WROOM-32 GPIO6 to GPIO11</text>
<text class="note" x="760" y="483" text-anchor="start">are the module's own flash and never reach the header, and</text>
<text class="note" x="760" y="496" text-anchor="start">GPIO3 is U0RXD, the receive side of the CP2102 that is this</text>
<text class="note" x="760" y="509" text-anchor="start">board's only console. The C6 map would drive the flash the</text>
<text class="note" x="760" y="522" text-anchor="start">program runs from. So: D25 latch, D26 clock, D27 data, ADJACENT</text>
<text class="note" x="760" y="535" text-anchor="start">on the EN side, GND four pins below them on the same side, 3V3</text>
<text class="note" x="760" y="548" text-anchor="start">the first pin of the other side. The EN side reads, up from</text>
<text class="note" x="760" y="561" text-anchor="start">the USB end:</text>
<text class="note" x="760" y="574" text-anchor="start"></text>
<text class="note" x="760" y="587" text-anchor="start">        VIN  GND  13  12  14  27  26  25  33  32  35  34  VN  VP  EN</text>
<text class="note" x="760" y="600" text-anchor="start"></text>
<text class="note" x="760" y="613" text-anchor="start">D4 (MODE_SW) and D2 (LED) are NC here: the firmware reads one</text>
<text class="note" x="760" y="626" text-anchor="start">with a pullup and drives the other. D2 is the devkit's own blue</text>
<text class="note" x="760" y="639" text-anchor="start">LED, so the pad-held light needs no wiring on this board.</text>
<text class="note" x="760" y="652" text-anchor="start"></text>
<text class="note" x="760" y="665" text-anchor="start">ALSO NOT YOURS: TX0 and RX0 (the console), D12 and D15 (strapping</text>
<text class="note" x="760" y="678" text-anchor="start">pins the module samples at reset), and D34, D35, VP, VN, which</text>
<text class="note" x="760" y="691" text-anchor="start">are input only with no pullup. The header page lists them.</text>
<text class="note" x="760" y="704" text-anchor="start"></text>
<text class="note" x="760" y="717" text-anchor="start">C1 goes across the breadboard's own 3V3 and GND rails, not the</text>
<text class="note" x="760" y="730" text-anchor="start">board's pins, as on every sheet since 2026-09-15.</text>
<rect class="zone" x="20" y="782" width="1520" height="262" rx="6"/>
<text class="sub" x="28" y="796" text-anchor="start">WHAT THIS BOARD DOES, MEASURED 2026-09-30 with the bench head as the host</text>
<text class="pin" x="40" y="812" text-anchor="start">BLE HID</text>
<text class="pin" x="168" y="812" text-anchor="start">ADVERTISES AND BONDS. Boots straight into firmware/pad-ble built for esp32:esp32:esp32 (84% of the app partition), prints the key map and</text>
<text class="pin" x="168" y="825" text-anchor="start">advertising as NES Pad, and the bench head's own radio lists it. BLEDevice::init does not crash here, unlike the P4. Paired from the head with an</text>
<text class="pin" x="168" y="838" text-anchor="start">agent registered (a non-interactive bluetoothctl pair fails, no agent for the request), it bonds and the head grows a NES Pad keyboard on uhid.</text>
<text class="pin" x="168" y="851" text-anchor="start">One connect prints one linked line, one disconnect one unlinked. NOT TESTED: a pad wired to it, a phone. A floating D27 reads ff, all pressed.</text>
<text class="pin" x="40" y="867" text-anchor="start">FORGET</text>
<text class="pin" x="168" y="867" text-anchor="start">WORKS ON THIS PART NOW, AND DID NOT. The sketch cleared bonds only under NimBLE; this core is Bluedroid, so FORGET printed rc -1 and cleared</text>
<text class="pin" x="168" y="880" text-anchor="start">nothing while a reflash blanked the bond store anyway: the one-sided bond with no way out. It lists and removes the bonds one by one now, measured</text>
<text class="pin" x="168" y="893" text-anchor="start">both ways: board blank and head bonded, the head connects and gets nothing (bluetoothd's unlikely error lines are the only tell); FORGET with one</text>
<text class="pin" x="168" y="906" text-anchor="start">bond stored answers 1 bond(s) were stored here, rc 0, and the head's next connect drops until it removes its side and pairs again.</text>
<text class="pin" x="40" y="922" text-anchor="start">Flashing</text>
<text class="pin" x="168" y="922" text-anchor="start">Through the CP2102 at /dev/ttyUSB0 on the bench head, esptool's default reset, the merged image at 0x0 at 921600. The board arrived running an AT</text>
<text class="pin" x="168" y="935" text-anchor="start">firmware (an at_customize partition, version line 2.4.0). Its ROM banner appears only when the reset is driven through RTS, not DTR alone.</text>
<text class="pin" x="40" y="951" text-anchor="start">Serial</text>
<text class="pin" x="168" y="951" text-anchor="start">Unlike the P4 over USB, this board's Serial IS the CP2102, so the B xx lines and STATUS, KEYS and FORGET are readable on the bench head at 115200.</text>
<text class="pin" x="40" y="967" text-anchor="start">Two players</text>
<text class="pin" x="168" y="967" text-anchor="start">Not on this sheet. A keyboard report carries six key slots and two pads can ask for ten, so a second pad could be polled and never sent.</text>
</svg>