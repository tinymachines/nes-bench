<rect x="0" y="0" width="1095.8" height="607.0" fill="#ffffff"/>
<g class="sheet-heading" data-height="60">
<text class="title" x="24" y="30">nes-bench bridge v1c: v1b as a printed shield, the hands on board  (sheet 4 of 5: the reset hand and the cables)</text>
<text class="sub" x="24" y="46">the circuit that passed bench-check on 2026-10-17, net for net, on an UNO shield; keyed cables, the reset opto and the power relay as bare parts. 2026-10-17. Not built.</text>
</g>
