<line class="lead" x1="806.8" y1="265.0" x2="812.8" y2="271.0"/><line class="lead" x1="806.8" y1="271.0" x2="812.8" y2="265.0"/>
<text class="note" x="48.0" y="525.0" text-anchor="start">GPIO17 at 3.3 V through R3 lights OK1's LED at about 4.5 mA ((3.3 - 1.2) / 470).</text>
<text class="note" x="48.0" y="538.0" text-anchor="start">Its transistor sits across the reset button with no pull-up of its own, as v1b's</text>
<text class="note" x="48.0" y="551.0" text-anchor="start">module did with VCC open: C on orange (4.40 V above yellow, MEASURED 2026-09-17),</text>
<text class="note" x="48.0" y="564.0" text-anchor="start">E on yellow. GPIO17 high closes it: the reset button, pressed by the head.</text>
<text class="note" x="515.4000000000001" y="525.0" text-anchor="start">PI_GND is the Pi's ground and is joined to GND nowhere on this board: the Pi</text>
<text class="note" x="515.4000000000001" y="538.0" text-anchor="start">reaches the console's ground through the UNO's USB lead only, as on v1b. The</text>
<text class="note" x="515.4000000000001" y="551.0" text-anchor="start">opto's two sides share nothing but light. PWR_DRIVE and PI_5V go to sheet 5.</text>
</svg>